[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-customer-intelligence"
version = "1.0.0"
description = "Evidence-backed retail analytics and customer opportunity discovery"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<4.0",
  "numpy>=1.24,<3.0",
  "streamlit>=1.32,<2.0",
  "plotly>=5.18,<7.0",
  "openpyxl>=3.1,<4.0",
  "scikit-learn>=1.3,<2.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
